<!-- templates/veterinario/listar.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Veterinários')}"></head>
<body>
<div th:replace="~{fragments/layout :: menu}"></div>

<h1>Veterinários</h1>
<a th:href="@{/web/veterinario/novo}">+ Novo Veterinário</a>

<table>
    <thead>
    <tr><th>ID</th><th>Nome</th><th>Área</th><th>CRMV</th><th>Ações</th></tr>
    </thead>
    <tbody>
    <tr th:each="vet : ${veterinarios.content}">
        <td th:text="${vet.id}">1</td>
        <td th:text="${vet.nome}">Nome</td>
        <td th:text="${vet.area}">Área</td>
        <td th:text="${vet.crmv.uf} + ' ' + ${vet.crmv.numeroDeInscricao}">SP 12345</td>
        <td>
            <a th:href="@{/web/veterinario/{id}/editar(id=${vet.id})}">Editar</a>
            <form th:action="@{/web/veterinario/{id}/deletar(id=${vet.id})}" method="post" style="display:inline;">
                <button type="submit" onclick="return confirm('Confirma exclusão?')">Excluir</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<div th:if="${!veterinarios.first}"><a th:href="@{/web/veterinario(pagina=${veterinarios.number - 1})}">Anterior</a></div>
<span th:text="'Página ' + (${veterinarios.number} + 1) + ' de ' + ${veterinarios.totalPages}"></span>
<div th:if="${!veterinarios.last}"><a th:href="@{/web/veterinario(pagina=${veterinarios.number + 1})}">Próxima</a></div>
</body>
</html>
