# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# ATENCAO: se voce linkar o repositorio pelo Deployment Center do Azure Portal,
# o Azure pode gerar/sobrescrever este arquivo com o nome do Web App e o secret
# de publish profile corretos automaticamente. Ajuste "app-name" e o secret de
# publish profile abaixo para os valores reais do seu Web App antes de usar.

name: 'Build and deploy JAR app to Azure Web App: challengeClyvo'

on:
  push:
    branches:
    - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./challengeClyvo

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java version
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build with Maven
      run: mvn clean install
      env:
        SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
        SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
        SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'challengeClyvo'
        slot-name: 'production'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: '${{ github.workspace }}/challengeClyvo/target/*.jar'
